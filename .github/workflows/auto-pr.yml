name: Auto open pull request on puzzle branches

on:
  push:
    branches:
      - 'puzzle/**'

jobs:
  open-pull-request:
    runs-on: ubuntu-latest
    steps:
      - name: get issue
        id: get_issue
        run: |
          if [[ ${{ github.ref_name }} =~ puzzle/([0-9]{4})-day-([1-9]|1[0-9]|2[0-5]) ]]; then
            year=${BASH_REMATCH[1]}
            day=${BASH_REMATCH[2]}

            issue_info=$(gh issue list -S '[$year] [Day $day] in:title' --json number,title | jq '.[].number')
            issue_number=$(echo "issue_info" | jq -r '.[].number')
            issue_title=$(echo "issue_info" | jq -r '.[].title')

            if [ -z "$issue_number" ]; then
              echo "::error::Issue not found!"
              exit 1
            else
              echo "issue_number=${issue_number}" >> $GITHUB_OUTPUT
              echo "issue_title=${issue_title}" >> $GITHUB_OUTPUT
            fi
          else
            echo "::error::Branch does not match the expected pattern"
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.ACTION_TOKEN }}
      - name: create pull request
        run: gh pr create \
          -B ${{ github.event.repository.default_branch }} \
          -H ${{ github.ref_name }} \
          --title 'Pull request to resolve Puzzle ${{ steps.get_issue.outputs.issue_title }}' \
          --body 'Resolves #${{ steps.get_issue.outputs.issue_number }}
        env:
          GITHUB_TOKEN: ${{ secrets.ACTION_TOKEN }}
